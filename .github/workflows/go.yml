# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version-file: go.mod

    - name: Build
      run: make build

    - name: Run CacheServer
      run: |
        ./bin/tavern -c ./tests/config.test.yaml 2>&1 &
        sleep 2
        echo "CacheServer is running"

    - name: Test
      run: go test -count=1 -v -coverprofile=coverage.txt ./...

    - name: Upload coverage profile
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage
        path: coverage.txt
        if-no-files-found: error

  coverage:
    name: Go coverage report
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
    - name: Compare coverage with main
      id: report
      uses: fgrosse/go-coverage-report@v1.5.0
      with:
        skip-comment: ${{ github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]' }}

    - name: Show coverage in job summary
      env:
        REPORT: ${{ steps.report.outputs.coverage_report }}
      run: printf '%s\n' "$REPORT" >> "$GITHUB_STEP_SUMMARY"
